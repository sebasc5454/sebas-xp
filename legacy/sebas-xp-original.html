<title>Sebas XP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column RPG status screen of notched pixel panels, with a fixed command bar at the bottom */
:root{
  --bg:#14141c; --bg-dot:#1c1c27; --panel:#1f1f2b; --panel-2:#282837; --well:#121219;
  --line:#3b3a50; --line-hi:#55536e; --shade:#0c0c12;
  --ink:#dbd4c2; --dim:#948fa5; --faint:#625e75;
  --gold:#c7a25b; --gold-hi:#dfc285; --gold-lo:#7f6433;
  --good:#7fa36a; --bad:#b86660;
  --t-aca:#6f93bb; --t-eng:#c08a4e; --t-skl:#86a76f; --t-car:#a584b0; --t-fit:#bb6a63; --t-soc:#5f9c95; --t-dis:#9490ae;
  --tier1:#9a6f4c; --tier2:#8d93a0; --tier3:#6fa39b; --tier4:#c7a25b; --tier5:#a0668f;
  --scrim:rgba(8,8,12,.82);
  --f-display:"Press Start 2P","Courier New",monospace;
  --f-body:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  --notch:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{
  font-family:var(--f-body);font-size:16px;line-height:1.35;
  background-image:radial-gradient(var(--bg-dot) 1px,transparent 1.2px);background-size:8px 8px;
  -webkit-font-smoothing:none;
}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}
.disp{font-family:var(--f-display);letter-spacing:.02em}
.px{background:var(--panel);border:3px solid var(--line);clip-path:var(--notch);box-shadow:inset 0 -4px 0 var(--shade),inset 0 3px 0 var(--panel-2)}
.lbl{font-family:var(--f-display);font-size:9px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 2px}
.sechead h2{margin:0;font-family:var(--f-display);font-size:11px;letter-spacing:.06em;color:var(--gold);text-wrap:balance}
.sechead span{font-size:14px;color:var(--dim)}
.muted{color:var(--dim)}
.ic{width:16px;height:16px;flex:none;image-rendering:pixelated;shape-rendering:crispEdges}

/* HUD */
.hud{padding:16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.crest{width:72px;height:72px;position:relative;display:grid;place-items:center}
.crest svg{position:absolute;inset:0;width:100%;height:100%}
.crest b{position:relative;font-family:var(--f-display);font-size:12px;margin-top:-6px;color:var(--ink);text-shadow:2px 2px 0 var(--shade)}
.hud-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hud-name{font-family:var(--f-display);font-size:11px;color:var(--dim);letter-spacing:.1em}
.hud-lv{font-family:var(--f-display);font-size:26px;line-height:1;color:var(--ink);text-shadow:3px 3px 0 var(--shade)}
.hud-lv small{font-size:11px;color:var(--dim);margin-right:6px}
.hud-rank{font-size:17px;color:var(--gold);margin-top:6px}
.hud-rank span{color:var(--dim);font-size:14px}
.hud-bar{grid-column:1/-1}
.sync{font-family:var(--f-display);font-size:8px;color:var(--faint);letter-spacing:.08em}
.sync.warn{color:var(--bad)}

/* bars */
.bar{position:relative;height:22px;background:var(--well);border:3px solid var(--line);clip-path:var(--notch);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--gold);box-shadow:inset 0 3px 0 var(--gold-hi),inset 0 -4px 0 var(--gold-lo);transition:width .6s steps(12,end)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),var(--well) calc(10% - 2px) 10%);pointer-events:none}
.bar.thin{height:12px;border-width:2px}
.bar.thin i{box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.3)}
.bar.thin::after{background:repeating-linear-gradient(90deg,transparent 0 calc(5% - 1px),var(--well) calc(5% - 1px) 5%)}
.barmeta{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:14px;color:var(--dim)}
.barmeta b{color:var(--ink);font-weight:600}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .v{font-family:var(--f-display);font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-size:13px;color:var(--dim)}
.v.good{color:var(--good)} .v.bad{color:var(--bad)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}

/* perfect day */
.pd{padding:14px;display:flex;flex-direction:column;gap:10px}
.pd-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pd-top b{font-family:var(--f-display);font-size:12px}
.pd-list{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:2px solid var(--line);background:var(--panel-2);font-size:14px;clip-path:var(--notch)}
.chip.done{border-color:var(--good);color:var(--good)}
.chip .box{width:10px;height:10px;border:2px solid currentColor;flex:none}
.chip.done .box{background:currentColor}
.pd.complete{border-color:var(--gold)}

/* favorites grid */
.favs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fav{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:11px 11px 12px;text-align:left;background:var(--panel);border:3px solid var(--line);clip-path:var(--notch);box-shadow:inset 0 -4px 0 var(--shade);min-height:92px;transition:transform .08s steps(2)}
.fav:hover{border-color:var(--line-hi)}
.fav:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 var(--shade)}
.fav .fname{font-size:15px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.fav .fx{margin-top:auto;display:flex;justify-content:space-between;width:100%;align-items:center}
.fav .fx b{font-family:var(--f-display);font-size:10px;color:var(--gold)}
.fav .fx em{font-style:normal;font-size:13px;color:var(--dim)}
.fav[disabled]{opacity:.45;cursor:default}
.empty{padding:18px;text-align:center;color:var(--dim);font-size:15px}

/* trees */
.mini{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:18px 1fr auto;gap:4px 10px;align-items:center}
.mrow .mn{font-size:15px;display:flex;gap:8px;align-items:baseline;min-width:0}
.mrow .mn span{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .ml{font-family:var(--f-display);font-size:10px}
.mrow .bar{grid-column:2/-1}
.tree{padding:14px;display:flex;flex-direction:column;gap:10px}
.tree-top{display:flex;align-items:center;gap:10px}
.tree-top .ic{width:24px;height:24px}
.tree-top h3{margin:0;font-family:var(--f-display);font-size:12px;letter-spacing:.04em}
.tree-top .tl{margin-left:auto;font-family:var(--f-display);font-size:14px}
.tree-rank{font-size:16px}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.rung{padding:6px 4px;font-size:12px;text-align:center;border:2px solid var(--line);color:var(--faint);background:var(--well);clip-path:var(--notch);overflow-wrap:anywhere;line-height:1.15}
.rung.got{color:var(--dim)}
.rung.now{color:var(--ink);border-color:currentColor}
.rung small{display:block;font-family:var(--f-display);font-size:8px;margin-bottom:3px;opacity:.8}

/* log */
.tools{display:flex;flex-direction:column;gap:10px}
.search{width:100%;padding:10px 12px;background:var(--well);border:3px solid var(--line);clip-path:var(--notch);font-size:16px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{padding:6px 9px;border:2px solid var(--line);background:var(--panel);font-size:14px;display:inline-flex;gap:6px;align-items:center;clip-path:var(--notch)}
.fbtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.group{padding:0;overflow:hidden}
.ghead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--panel-2);border-bottom:3px solid var(--line)}
.ghead h3{margin:0;font-family:var(--f-display);font-size:11px;letter-spacing:.05em}
.ghead span{margin-left:auto;font-size:14px;color:var(--dim)}
.row{display:grid;grid-template-columns:34px 1fr 34px auto;align-items:center;gap:6px;padding:7px 8px 7px 6px;border-bottom:2px solid var(--panel-2)}
.row:last-child{border-bottom:0}
.row .rname{font-size:15px;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.tag{display:inline-block;font-family:var(--f-display);font-size:8px;letter-spacing:.06em;padding:3px 5px;margin-left:6px;vertical-align:2px;border:1px solid currentColor;color:var(--dim)}
.tag.today{color:var(--good)}
.tag.pdh{color:var(--gold)}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;background:none;border:0;color:var(--faint);font-size:18px}
.iconbtn:hover{color:var(--ink)}
.star[aria-pressed="true"]{color:var(--gold)}
.logbtn{min-width:64px;padding:8px 10px;font-family:var(--f-display);font-size:10px;background:var(--panel-2);border:2px solid var(--gold-lo);color:var(--gold);clip-path:var(--notch);box-shadow:inset 0 -3px 0 var(--shade)}
.logbtn:hover{border-color:var(--gold)}
.logbtn:active{box-shadow:none;transform:translateY(1px)}
.logbtn[disabled]{color:var(--faint);border-color:var(--line);cursor:default}
.custom{padding:14px;display:flex;flex-direction:column;gap:10px}
.custom summary{cursor:pointer;font-family:var(--f-display);font-size:11px;color:var(--gold);list-style:none}
.custom summary::-webkit-details-marker{display:none}
.fgrid{display:grid;grid-template-columns:1fr 150px 90px;gap:8px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr 1fr}.fgrid .span{grid-column:1/-1}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input,.field select{width:100%;padding:9px 10px;background:var(--well);border:2px solid var(--line);font-size:16px;min-width:0}
.check{display:flex;align-items:center;gap:8px;font-size:15px}
.check input{width:18px;height:18px;accent-color:var(--gold)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 14px;font-family:var(--f-display);font-size:10px;letter-spacing:.04em;background:var(--panel-2);border:2px solid var(--line-hi);clip-path:var(--notch);box-shadow:inset 0 -3px 0 var(--shade)}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:default}

/* history */
.chart{padding:14px 14px 10px}
.cwrap{position:relative;height:140px;display:grid;grid-template-columns:repeat(14,1fr);grid-template-rows:1fr;gap:4px;align-items:end;margin-top:12px;border-bottom:2px solid var(--line)}
.cbar{background:var(--panel-2);position:relative;min-height:2px}
.cbar.hit{background:var(--gold);box-shadow:inset 0 2px 0 var(--gold-hi)}
.cbar.part{background:var(--gold-lo)}
.cbar.today{outline:2px solid var(--ink);outline-offset:1px}
.pace{position:absolute;left:0;right:0;border-top:2px dashed var(--dim);pointer-events:none}
.pace span{position:absolute;right:0;top:-18px;font-family:var(--f-display);font-size:8px;color:var(--dim);background:var(--panel);padding:0 3px}
.cdays{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:6px}
.cdays span{text-align:center;font-family:var(--f-display);font-size:8px;color:var(--faint)}
.day{padding:0;overflow:hidden}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--panel-2);border-bottom:3px solid var(--line)}
.dhead b{font-family:var(--f-display);font-size:10px}
.dhead span{font-family:var(--f-display);font-size:10px;color:var(--gold)}
.hrow{display:grid;grid-template-columns:44px 12px 1fr auto auto;gap:8px;align-items:center;padding:7px 10px 7px 14px;border-bottom:2px solid var(--panel-2);font-size:15px}
.hrow:last-child{border-bottom:0}
.hrow time{font-size:13px;color:var(--dim)}
.dot{width:10px;height:10px}
.hrow .hx{font-family:var(--f-display);font-size:9px;color:var(--gold)}
.hrow .hn{min-width:0;overflow-wrap:anywhere}
.hrow .del{font-size:13px;padding:4px 8px;background:none;border:2px solid transparent;color:var(--faint)}
.hrow .del:hover{color:var(--bad)}
.hrow .del.arm{border-color:var(--bad);color:var(--bad);font-family:var(--f-display);font-size:8px}

/* setup */
.set{padding:14px;display:flex;flex-direction:column;gap:12px}
.set h3{margin:0;font-family:var(--f-display);font-size:11px;color:var(--gold)}
.set p{margin:0;color:var(--dim);font-size:15px;max-width:60ch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--dim)} .kv dd{margin:0}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;background:var(--well);border:2px solid var(--line);font-size:15px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:3px solid var(--line);padding:0 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{padding:9px 2px 8px;background:none;border:0;border-top:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--faint);font-family:var(--f-display);font-size:8px;letter-spacing:.05em}
.tab .ic{width:18px;height:18px}
.tab[aria-selected="true"]{color:var(--gold)}
.tab[aria-selected="true"]{border-top-color:var(--gold)}

/* toasts, float, overlay, sheet */
.toasts{position:fixed;left:0;right:0;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;max-width:100%;padding:9px 12px;background:var(--panel-2);border:3px solid var(--line-hi);clip-path:var(--notch);font-size:15px;box-shadow:inset 0 -3px 0 var(--shade);animation:tin .18s steps(3)}
.toast.gold{border-color:var(--gold);color:var(--gold-hi)}
.toast button{background:none;border:0;font-family:var(--f-display);font-size:9px;color:var(--gold);padding:4px}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.floatxp{position:fixed;z-index:50;pointer-events:none;font-family:var(--f-display);font-size:13px;color:var(--gold-hi);text-shadow:2px 2px 0 var(--shade);animation:flt .9s steps(9) forwards}
@keyframes flt{to{transform:translateY(-46px);opacity:0}}
.overlay{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:16px}
.ov{position:relative;width:min(420px,100%);padding:26px 20px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;border-color:var(--gold);animation:pop .35s steps(5)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.ov h2{margin:0;font-family:var(--f-display);font-size:18px;color:var(--gold-hi);text-shadow:3px 3px 0 var(--shade);letter-spacing:.04em}
.ov .big{font-family:var(--f-display);font-size:40px;line-height:1;text-shadow:4px 4px 0 var(--shade)}
.ov .sub{font-size:18px;color:var(--gold)}
.ov ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--dim)}
.ov ul b{color:var(--ink);font-weight:600}
.ov .crest{width:96px;height:96px}
.ov .crest b{font-size:16px}
.spark{position:absolute;left:50%;top:42%;z-index:1;width:6px;height:6px;background:var(--gold-hi);animation:burst .9s steps(8) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.sheet{position:fixed;inset:0;z-index:55;background:var(--scrim);display:grid;align-items:end;justify-items:center;padding:16px}
.sheet .px{width:min(520px,100%);padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:env(safe-area-inset-bottom,0px)}
.sheet h3{margin:0;font-family:var(--f-display);font-size:11px;color:var(--gold);line-height:1.5}
.loading{font-family:var(--f-display);font-size:9px;color:var(--dim);text-align:center;padding:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app">
  <section id="v-home" class="view">
    <div class="px hud" id="hud">
      <div class="crest" id="hud-crest"></div>
      <div>
        <div class="hud-top"><span class="hud-name">SEBAS</span><span class="sync" id="sync">LOADING</span></div>
        <div class="hud-lv" id="hud-lv"><small>LV</small>1</div>
        <div class="hud-rank" id="hud-rank">Apprentice <span>· Tier I</span></div>
      </div>
      <div class="hud-bar">
        <div class="bar"><i id="hud-fill"></i></div>
        <div class="barmeta"><span id="hud-into"><b>0</b> / 300 XP</span><span id="hud-total">0 total XP</span></div>
      </div>
    </div>
  </section>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="overlay" id="overlay" hidden></div>
<div class="sheet" id="sheet" hidden></div>

<nav class="nav" aria-label="Sections"><div class="nav-in" role="tablist" id="nav"></div></nav>

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const START='2026-09-29', PACE=154, RESET_HOUR=4, XP_TO_100=56175, LOCAL_KEY='sebasxp_save_v1';
const W=[300,450,575,700,825], WSUM=27675;
const TIERS=[['I','Apprentice','--tier1'],['II','Technician','--tier2'],['III','Engineer','--tier3'],['IV','Senior Engineer','--tier4'],['V','Chief Engineer','--tier5']];
const TREES=[
  {id:'aca',name:'Academics',color:'--t-aca',T:15000,icon:'book',ranks:['Student','Scholar','Analyst','Theorist','Master']},
  {id:'eng',name:'Engineering',color:'--t-eng',T:5000,icon:'gear',ranks:['Tinkerer','Builder','Designer','Innovator','Architect']},
  {id:'skl',name:'Skills',color:'--t-skl',T:5000,icon:'bulb',ranks:['Novice','Learner','Practitioner','Specialist','Expert']},
  {id:'car',name:'Career',color:'--t-car',T:5000,icon:'case',ranks:['Candidate','Intern-Ready','Contender','Professional','Executive']},
  {id:'fit',name:'Fitness',color:'--t-fit',T:12000,icon:'bell',ranks:['Rookie','Starter','Captain','Beast','Elite']},
  {id:'soc',name:'Social',color:'--t-soc',T:3500,icon:'heart',ranks:['Solo','Connected','Reliable','Respected','Leader']},
  {id:'dis',name:'Discipline',color:'--t-dis',T:11500,icon:'glass',ranks:['Recruit','Consistent','Locked In','Relentless','Unbreakable']}
];
TREES.forEach(t=>{t.costs=W.map(w=>Math.max(10,Math.round(w*t.T/WSUM/5)*5));});
const TREE=Object.fromEntries(TREES.map(t=>[t.id,t]));

/* [tree, id, name, xp, once] */
const DEFAULT_ACTS=[
 ['aca','study','Focused study block (50 min, phone away)',20],
 ['aca','lecture','Watched a lecture with full focus',15],
 ['aca','preview','Previewed the next lecture',10],
 ['aca','hw','Homework set submitted',30],
 ['aca','hwEarly','Homework done a day early (bonus)',15],
 ['aca','noAI','Attempted every problem before using AI',20],
 ['aca','phys','Physics 2 concept session',25],
 ['aca','practice','Extra practice problems (not assigned)',20],
 ['aca','guide','Made a formula sheet or study guide',30],
 ['aca','teach','Explained a concept to someone else',20],
 ['aca','group','Study group session',25],
 ['aca','oh','Office hours or tutoring',25],
 ['aca','lab','Lab report submitted',50],
 ['aca','examFix','Reworked every missed exam problem',30],
 ['aca','quizA','Quiz: A',50],
 ['aca','quizB','Quiz: B',30],
 ['aca','examA','Exam: A',200],
 ['aca','examB','Exam: B',120],
 ['aca','examC','Exam: C',50],
 ['aca','allClass','Attended every class this week',40],
 ['aca','noLate','Zero late assignments this week',30],
 ['aca','advisor','Met with academic advisor',40],
 ['aca','register','Registered for next semester',50],
 ['aca','courseA','Final course grade: A',300],

function parseYmd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12);}
function addDays(s,n){const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);}
function diffDays(a,b){const A=parseYmd(a),B=parseYmd(b);return Math.round((Date.UTC(B.getFullYear(),B.getMonth(),B.getDate())-Date.UTC(A.getFullYear(),A.getMonth(),A.getDate()))/864e5);}

const state={settings:clone(DEFAULT_SETTINGS),days:{},ready:false,mode:'loading',tab:'home',filter:'all',q:'',histShown:14};
function clone(o){return JSON.parse(JSON.stringify(o));}
let ACT={};
function buildActs(){
  const s=state.settings,A={};
  DEFAULT_ACTS.forEach(([tree,id,name,xp,once])=>{A[id]={id,tree,name,xp,once:!!once,custom:false};});
  (s.custom||[]).forEach(c=>{if(TREE[c.tree])A[c.id]={id:c.id,tree:c.tree,name:c.name,xp:c.xp,once:!!c.once,custom:true};});
  Object.entries(s.overrides||{}).forEach(([id,xp])=>{if(A[id])A[id].xp=xp;});
  Object.entries(s.onceOverrides||{}).forEach(([id,v])=>{if(A[id]&&!A[id].custom)A[id].once=!!v;});
  const hid=new Set(s.hidden||[]);Object.values(A).forEach(a=>a.hidden=hid.has(a.id));
  ACT=A;
}
function allEntries(){const out=[];for(const d in state.days)for(const e of state.days[d])out.push(e);return out;}
function dayBase(date){return (state.days[date]||[]).reduce((s,e)=>s+(e.k==='bonus'?0:e.x),0);}
function dayTotal(date){return (state.days[date]||[]).reduce((s,e)=>s+e.x,0);}
function claimed(){const s=new Set();allEntries().forEach(e=>{if(e.a)s.add(e.a);});return s;}
function todayCounts(){const m={};(state.days[gameDate(Date.now())]||[]).forEach(e=>{if(e.a)m[e.a]=(m[e.a]||0)+1;});return m;}

/* ---------- leveling ---------- */
const overallCost=L=>W[Math.min(4,Math.floor((L-1)/20))];
function levelOf(xp,costFn,max){let L=1,rem=xp;while(L<max){const c=costFn(L);if(rem>=c){rem-=c;L++;}else return {L,into:rem,need:c,maxed:false};}return {L:max,into:0,need:0,maxed:true};}
const tierIdx=L=>Math.min(4,Math.floor((L-1)/20));
const rankIdx=L=>Math.min(4,Math.floor((L-1)/10));
function snapshot(){
  let total=0;const tx={};TREES.forEach(t=>tx[t.id]=0);
  allEntries().forEach(e=>{total+=e.x;if(tx[e.t]!==undefined)tx[e.t]+=e.x;});
  const o=levelOf(total,overallCost,100);const trees={};
  TREES.forEach(t=>{trees[t.id]=Object.assign(levelOf(tx[t.id],L=>t.costs[rankIdx(L)],50),{xp:tx[t.id]});});
  return {total,o,trees};
}
function streakEnding(date){let n=0,d=date;while(dayBase(d)>=100){n++;d=addDays(d,-1);if(n>4000)break;}return n;}
function currentStreak(){const t=gameDate(Date.now());return dayBase(t)>=100?streakEnding(t):streakEnding(addDays(t,-1));}

/* ---------- bonuses ---------- */
const BONUS={perfect:{n:'Perfect Day',x:25},streak7:{n:'7-Day Streak',x:100},streak30:{n:'30-Day Streak',x:500}};
function reconcile(date){
  const entries=state.days[date]||[];
  const logged=new Set(entries.filter(e=>e.k!=='bonus'&&e.a).map(e=>e.a));
  const want=new Set();
  const habits=(state.settings.perfect||[]).filter(id=>ACT[id]);
  if(habits.length&&habits.every(id=>logged.has(id)))want.add('perfect');
  if(dayBase(date)>=100){const s=streakEnding(date);if(s%7===0)want.add('streak7');if(s%30===0)want.add('streak30');}
  const have=new Map(entries.filter(e=>e.k==='bonus').map(e=>[e.b,e]));
  const add=[],remove=[];
  want.forEach(b=>{if(!have.has(b)){const e={id:uid(),ts:Date.now(),a:null,n:BONUS[b].n,t:'dis',x:BONUS[b].x,k:'bonus',b};add.push(e);}});
  have.forEach((e,b)=>{if(!want.has(b))remove.push(e.id);});
  return {add,remove};
}

/* ---------- storage ---------- */
let db=null,downloads=null,chain=Promise.resolve(),pending=0;const dirty={};let settingsDirty=0;
let gotDays=false,gotSettings=false;
function setSync(txt,warn){const el=$('#sync');if(el){el.textContent=txt;el.classList.toggle('warn',!!warn);}}
function syncLabel(){if(state.mode==='local')setSync('SAVED ON THIS DEVICE');else if(state.mode==='db')setSync(pending?'SAVING':'SAVED');else setSync('LOADING');}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function retry(fn){try{return await fn();}catch(e){if(e&&e.code==='unavailable'){await sleep(400+Math.random()*800);return fn();}throw e;}}
function enqueue(fn){
  pending++;syncLabel();
  chain=chain.then(fn).catch(e=>{console.error(e);setSync('SAVE FAILED',true);
    const msg=e&&e.code==='quota_exceeded'?'Storage is full. Export your log, then clear old days in Setup.':'A save failed. Check your connection; the next log will try again.';
    toast(msg);}).finally(()=>{pending--;syncLabel();});
  return chain;
}
function saveLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify({settings:state.settings,days:state.days}));}catch(e){}}
function saveSettings(){
  buildActs();
  if(state.mode==='local'){saveLocal();return;}
  settingsDirty++;
  enqueue(async()=>{try{await retry(()=>db.doc('config/settings').set(clone(state.settings)));}finally{settingsDirty--;}});
}
function mergeSettings(s){const out=Object.assign(clone(DEFAULT_SETTINGS),s||{});['favorites','perfect','hidden','custom'].forEach(k=>{if(!Array.isArray(out[k]))out[k]=clone(DEFAULT_SETTINGS[k]);});if(typeof out.overrides!=='object'||!out.overrides)out.overrides={};if(typeof out.onceOverrides!=='object'||!out.onceOverrides)out.onceOverrides={};return out;}
function maybeReady(){if(!state.ready&&gotDays&&gotSettings){state.ready=true;syncLabel();render();}}
async function initStore(){
  let d=null;
  try{d=window.claude&&window.claude.use?await window.claude.use('db'):null;}catch(e){d=null;}
  try{downloads=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){downloads=null;}
  if(!d){
    state.mode='local';
    try{const raw=localStorage.getItem(LOCAL_KEY);if(raw){const o=JSON.parse(raw);state.settings=mergeSettings(o.settings);state.days=o.days||{};}}catch(e){}
    buildActs();state.ready=true;syncLabel();render();return;
  }
  db=d;state.mode='db';syncLabel();
  db.doc('config/settings').onSnapshot(snap=>{
    if(!settingsDirty){state.settings=mergeSettings(snap.exists?snap.data():null);buildActs();}
    gotSettings=true;maybeReady();if(state.ready)render();
  },err=>{console.error(err);gotSettings=true;maybeReady();});
  db.collection('days').onSnapshot(snap=>{
    const next={};snap.docs.forEach(doc=>{const b=doc.data();if(b&&Array.isArray(b.entries)&&b.entries.length)next[doc.id]=b.entries.slice();});
    Object.keys(dirty).forEach(date=>{if(state.days[date])next[date]=state.days[date];else delete next[date];});
    state.days=next;gotDays=true;maybeReady();if(state.ready)render();
  },err=>{console.error(err);setSync('OFFLINE',true);toast('Lost the connection to your save file. Reload the page to reconnect.');});
}

/* ---------- sound ---------- */
let actx=null;
function tone(freq,start,dur,vol){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}}
  const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=freq;
  const t=actx.currentTime+start;g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.02);
}
function sfx(kind){
  if(!state.settings.sound)return;
  if(kind==='blip'){tone(660,0,.07);tone(990,.06,.09);}
  else if(kind==='small'){[587,784,988].forEach((f,i)=>tone(f,i*.07,.1));}
  else if(kind==='level'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.14));tone(1047,.4,.35,.04);}
  else if(kind==='rank'){[392,523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*.1,.16));tone(1319,.75,.6,.04);}
}

/* ---------- UI feedback ---------- */
function toast(msg,opt){
  opt=opt||{};const box=$('#toasts');const el=document.createElement('div');el.className='toast'+(opt.gold?' gold':'');
  el.innerHTML=`<span>${esc(msg)}</span>`;
  if(opt.undo){const b=document.createElement('button');b.textContent='UNDO';b.onclick=()=>{opt.undo();el.remove();};el.appendChild(b);}
  box.appendChild(el);while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>el.remove(),opt.undo?6000:3200);
}
function floatXP(el,x){
  if(!el||!el.getBoundingClientRect)return;const r=el.getBoundingClientRect();
  const f=document.createElement('div');f.className='floatxp';f.textContent=`+${x} XP`;
  f.style.left=Math.max(8,Math.min(window.innerWidth-110,r.left+r.width/2-40))+'px';f.style.top=(r.top-6)+'px';
  document.body.appendChild(f);setTimeout(()=>f.remove(),950);
}
function showOverlay(o){
  const ov=$('#overlay');let head='',body='';
  const lines=o.lines.map(l=>`<li>${pix(TREE[l.t].icon,cv(TREE[l.t].color))} <b>${esc(TREE[l.t].name)}</b> ${l.rank?`ranked up to <b>${esc(l.rank)}</b>`:'reached'} LV ${l.L}</li>`).join('');
  if(o.kind==='rank'){head=`<h2>RANK UP!</h2><div class="crest">${crest(o.tier)}</div><div class="big">LV ${o.L}</div><div class="sub">${esc(TIERS[o.tier][1])} · Tier ${TIERS[o.tier][0]}</div>`;}
  else if(o.kind==='level'){head=`<h2>${o.L>=100?'MAX LEVEL':'LEVEL UP!'}</h2><div class="big">LV ${o.L}</div><div class="sub">${esc(TIERS[o.tier][1])}</div>`;}
  else{head=`<h2>SKILL RANK UP!</h2>`;}
  const sparks=Array.from({length:18},(_,i)=>{const a=i/18*Math.PI*2,d=110+Math.random()*60;return `<span class="spark" style="--dx:${Math.round(Math.cos(a)*d)}px;--dy:${Math.round(Math.sin(a)*d)}px"></span>`;}).join('');
  body=`${lines?`<ul>${lines}</ul>`:''}<button class="btn gold" id="ov-ok">CONTINUE</button>`;
  ov.innerHTML=`${sparks}<div class="px ov" role="dialog" aria-modal="true" aria-label="Level up">${head}${body}</div>`;
  ov.hidden=false;const ok=$('#ov-ok');ok.focus();ok.onclick=()=>{ov.hidden=true;ov.innerHTML='';};
}
function animateHud(beforePct,levels){
  const el=$('#hud-fill');if(!el)return;const target=el.style.width;
  el.style.transition='none';el.style.width=beforePct+'%';void el.offsetWidth;
  el.style.transition='';el.style.width='100%';
  setTimeout(()=>{el.style.transition='none';el.style.width='0%';void el.offsetWidth;el.style.transition='';el.style.width=target;},levels>1?750:650);
}
function celebrate(b,a,gained,bonus,el){
  floatXP(el,gained);
  const lines=[];
  TREES.forEach(t=>{const lb=b.trees[t.id].L,la=a.trees[t.id].L;if(la>lb){const rb=rankIdx(lb),ra=rankIdx(la);lines.push({t:t.id,L:la,rank:ra>rb?t.ranks[ra]:null});}});
  if(a.o.L>b.o.L){
    const tb=tierIdx(b.o.L),ta=tierIdx(a.o.L);
    const bp=b.o.maxed?100:b.o.into/b.o.need*100;animateHud(bp,a.o.L-b.o.L);
    setTimeout(()=>{showOverlay({kind:ta>tb?'rank':'level',L:a.o.L,tier:ta,lines});sfx(ta>tb?'rank':'level');},state.tab==='home'?700:0);
  }else if(lines.some(l=>l.rank)){showOverlay({kind:'trank',lines:lines.filter(l=>l.rank)});sfx('level');}
  else if(lines.length){lines.forEach(l=>toast(`${TREE[l.t].name.toUpperCase()} REACHED LV ${l.L}`,{gold:true}));sfx('small');}
  else sfx('blip');
  bonus.forEach(e=>toast(`${e.n.toUpperCase()}  +${e.x} XP`,{gold:true}));
}

function logEntry(entry,el){
  if(!state.ready){toast('Still loading your save file.');return;}
  const before=snapshot();const date=gameDate(entry.ts);
  commitDayLocalOnly(date,[entry],[]);
  const r=reconcile(date);
  commitDayLocalOnly(date,r.add,r.remove);
  persistDay(date,[entry].concat(r.add),r.remove);
  const after=snapshot();render();
  celebrate(before,after,entry.x,r.add,el);
  toast(`+${entry.x} XP · ${entry.n}`,{undo:()=>undo(date,entry.id)});
}
/* local-only apply, then one persisted op */
function commitDayLocalOnly(date,add,remove){const cur=state.days[date]||[];const rm=new Set(remove);let next=cur.filter(e=>!rm.has(e.id)).concat(add);next.sort((a,b)=>a.ts-b.ts);if(next.length)state.days[date]=next;else delete state.days[date];}
function persistDay(date,add,remove){
  if(state.mode==='local'){saveLocal();return;}
  const rm=new Set(remove);dirty[date]=(dirty[date]||0)+1;
  enqueue(async()=>{
    try{
      const ref=db.doc('days/'+date);const snap=await retry(()=>ref.get());
      let entries=snap.exists?((snap.data().entries)||[]).slice():[];
      entries=entries.filter(e=>!rm.has(e.id));const have=new Set(entries.map(e=>e.id));
      add.forEach(e=>{if(!have.has(e.id))entries.push(e);});entries.sort((a,b)=>a.ts-b.ts);
      if(entries.length)await retry(()=>ref.set({date,entries}));else await retry(()=>ref.delete());
    }finally{dirty[date]--;if(!dirty[date])delete dirty[date];}
  });
}
function removeEntry(date,id){
  commitDayLocalOnly(date,[],[id]);const r=reconcile(date);commitDayLocalOnly(date,r.add,r.remove);
  persistDay(date,r.add,[id].concat(r.remove));render();
}
function undo(date,id){removeEntry(date,id);toast('Undone');}
function logAct(id,el){
  const a=ACT[id];if(!a)return;

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){state.tab=t.dataset.tab;render();window.scrollTo(0,0);return;}
  if(t.dataset.log){logAct(t.dataset.log,t);return;}
  if(t.dataset.fav){toggleFav(t.dataset.fav);return;}
  if(t.dataset.edit){openEdit(t.dataset.edit);return;}
  if(t.dataset.filter){state.filter=t.dataset.filter;render();return;}
  if(t.dataset.unpd){const p=state.settings.perfect;p.splice(p.indexOf(t.dataset.unpd),1);saveSettings();render();return;}
  if(t.dataset.del){
    if(!t.classList.contains('arm')){document.querySelectorAll('.del.arm').forEach(b=>{b.classList.remove('arm');b.textContent='✕';});t.classList.add('arm');t.textContent='DELETE?';return;}
    const [d,id]=t.dataset.del.split('|');removeEntry(d,id);toast('Entry deleted');return;}
  const act=t.dataset.act;if(!act)return;
  if(act==='ed-save')saveEdit(t.dataset.id);
  else if(act==='ed-close')closeSheet();
  else if(act==='ed-delete'){const s=state.settings;const id=t.dataset.id;s.custom=s.custom.filter(c=>c.id!==id);['favorites','perfect','hidden'].forEach(k=>{s[k]=s[k].filter(x=>x!==id);});saveSettings();closeSheet();render();toast('Activity deleted. Past log entries stay.');}
  else if(act==='custom-log'||act==='custom-save'){
    const name=$('#cu-name').value.trim(),tree=$('#cu-tree').value,xp=Math.round(Number($('#cu-xp').value));
    if(!name){toast('Name what you did first.');return;}
    if(!(xp>=1&&xp<=5000)){toast('XP must be a whole number from 1 to 5000.');return;}
    if(act==='custom-log'){logEntry({id:uid(),ts:Date.now(),a:null,n:name,t:tree,x:xp,k:'custom'},t);}
    else{const id='c_'+uid();state.settings.custom.push({id,name,tree,xp,once:$('#cu-once').checked});state.settings.favorites.push(id);saveSettings();render();toast('Saved and added to favorites');}
  }
  else if(act==='more'){state.histShown+=14;render();}
  else if(act==='export')exportCSV();
  else if(act==='restore-values'){state.settings.overrides={};state.settings.onceOverrides={};saveSettings();render();toast('Default XP values restored');}
  else if(act==='unhide'){state.settings.hidden=[];saveSettings();render();toast('All activities visible');}
  else if(act==='reset'){if(($('#set-reset').value||'').trim()!=='RESET')return;
    const dates=Object.keys(state.days);dates.forEach(d=>{const ids=state.days[d].map(e=>e.id);commitDayLocalOnly(d,[],ids);persistDay(d,[],ids);});render();toast('Progress reset to LV 1');}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){state.q=e.target.value;render();}
  else if(e.target.id==='set-reset'){const b=$('#reset-btn');if(b)b.disabled=e.target.value.trim()!=='RESET';}
});
document.addEventListener('change',e=>{
  if(e.target.id==='set-sound'){state.settings.sound=e.target.checked;saveSettings();if(e.target.checked)sfx('blip');}
  else if(e.target.id==='set-hidden'){state.settings.showHidden=e.target.checked;saveSettings();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#sheet').hidden)closeSheet();else if(!$('#overlay').hidden){$('#overlay').hidden=true;}}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});
async function exportCSV(){
  if(!downloads)return;
  const rows=[['date','time','activity','tree','xp','type']];
  Object.keys(state.days).sort().forEach(d=>state.days[d].forEach(e=>{const tm=new Date(e.ts);rows.push([d,`${pad(tm.getHours())}:${pad(tm.getMinutes())}`,e.n,(TREE[e.t]||{}).name||e.t,e.x,e.k]);}));
  const csv=rows.map(r=>r.map(v=>{const s=String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');
  try{await downloads.save({filename:`sebas-xp-log-${gameDate(Date.now())}.csv`,data:csv});}
  catch(err){if(err&&err.code!=='declined')toast('Export is not available here.');}
}

/* refresh day-dependent numbers when the game day rolls over */
let lastDay=gameDate(Date.now());
setInterval(()=>{const d=gameDate(Date.now());if(d!==lastDay){lastDay=d;if(state.ready)render();}},60000);

buildActs();render();initStore();
})();
</script>
